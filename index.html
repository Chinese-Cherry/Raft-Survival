<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raft Survival - 3D 木筏求生</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; font-family: "Segoe UI", system-ui, sans-serif; }
    #app { width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      margin: -3px 0 0 -3px; background: #fff; border-radius: 50%; opacity: .85;
    }
    #charge {
      position: absolute; top: 50%; left: 50%; width: 90px; height: 6px;
      margin: 16px 0 0 -45px; background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.3); border-radius: 4px;
      overflow: hidden; display: none;
    }
    #charge > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #ffd34d, #ff7a3c);
    }
    #equipped {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.45); padding: 6px 16px; border-radius: 20px;
      font-size: 14px; display: none; z-index: 2;
    }
    #equipped .key { opacity: .6; font-size: 11px; margin-right: 6px; }

    /* 底部快捷栏：9 格 */
    #hotbar {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; pointer-events: auto; z-index: 2;
    }
    #hotbar .slot {
      width: 56px; height: 56px; background: rgba(0,0,0,.42);
      border: 2px solid rgba(255,255,255,.15); border-radius: 8px;
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; color: #fff;
      user-select: none;
    }
    #hotbar .slot.active {
      border-color: #ffd34d; box-shadow: 0 0 8px rgba(255,211,77,.6);
    }
    #hotbar .slot .num { position: absolute; top: 2px; left: 4px; font-size: 10px; opacity: .5; }
    #hotbar .slot .ico { font-size: 24px; line-height: 1; }
    #hotbar .slot .nm  { font-size: 10px; opacity: .8; margin-top: 2px; }
    #hotbar .slot .cnt { position: absolute; right: 4px; bottom: 2px; font-size: 12px; font-weight: 700; }
    #prompt {
      position: absolute; top: 58%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 8px; font-size: 15px; display: none;
    }
    #crafting {
      position: absolute; right: 16px; top: 16px; width: 240px;
      background: rgba(0,0,0,.4); padding: 12px; border-radius: 10px; display: none; pointer-events: auto;
    }
    #crafting h3 { font-size: 14px; margin-bottom: 8px; opacity: .85; }
    .recipe {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; margin-bottom: 6px; background: rgba(255,255,255,.08);
      border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .recipe:hover { background: rgba(255,255,255,.16); }
    .recipe.locked { opacity: .4; cursor: not-allowed; }
    #help {
      position: absolute; left: 16px; top: 16px; font-size: 12px; line-height: 1.6;
      background: rgba(0,0,0,.35); padding: 10px 12px; border-radius: 10px; opacity: .9;
    }
    #backpack {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 320px; background: rgba(0,0,0,.5); padding: 16px; border-radius: 12px;
      display: none; pointer-events: auto; z-index: 3;
    }
    /* 船帆互动面板 */
    #sail-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 280px; background: rgba(0,0,0,.6); padding: 16px; border-radius: 12px;
      display: none; pointer-events: auto; z-index: 4; text-align: center;
    }
    #sail-panel h3 { font-size: 15px; margin-bottom: 10px; }
    #sail-panel .state { font-size: 13px; opacity: .88; margin-bottom: 10px; line-height: 1.7; }
    #sail-panel button {
      width: 100%; margin-top: 8px; padding: 8px 0; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px; font-size: 13px;
    }
    #sail-panel button:hover { background: rgba(255,255,255,.22); }
    #sail-panel .row { display: flex; gap: 8px; }
    #sail-panel .row button { flex: 1; }
    /* 渔网储物面板（与背包同样式的 4x4 格子） */
    #net-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 320px; background: rgba(0,0,0,.6); padding: 16px; border-radius: 12px;
      display: none; pointer-events: auto; z-index: 4; text-align: center;
    }
    #net-panel h3 { font-size: 15px; margin-bottom: 10px; }
    #net-panel .state { font-size: 13px; opacity: .88; margin-bottom: 10px; line-height: 1.7; }
    #net-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px;
    }
    #net-panel button {
      width: 100%; margin-top: 8px; padding: 8px 0; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px; font-size: 13px;
    }
    #net-panel button:hover { background: rgba(255,255,255,.22); }
    #net-panel .row { display: flex; gap: 8px; }
    #net-panel .row button { flex: 1; }
    /* 渔网面板打开时：渔网在左、背包在右，并排显示便于转移物品 */
    #net-panel.with-backpack { left: calc(50% - 180px); }
    #backpack.with-net { left: calc(50% + 180px); }
    /* 远离木筏：Esc 传送确认面板 */
    #rescue-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 300px; background: rgba(0,0,0,.72); padding: 16px; border-radius: 12px;
      display: none; pointer-events: auto; z-index: 6; text-align: center;
      border: 1px solid rgba(255,211,77,.45);
    }
    #rescue-panel h3 { font-size: 15px; margin-bottom: 10px; color: #ffd34d; }
    #rescue-panel .state { font-size: 13px; opacity: .92; margin-bottom: 10px; line-height: 1.8; }
    #rescue-panel button {
      width: 100%; margin-top: 8px; padding: 8px 0; cursor: pointer;
      background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px; font-size: 13px;
    }
    #rescue-panel button:hover { background: rgba(255,255,255,.22); }
    #rescue-panel .row { display: flex; gap: 8px; }
    #rescue-panel .row button { flex: 1; }
    /* 设置面板（Esc 暂停）：音频通道开关 + 音量 */
    #settings-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 380px; background: rgba(8,14,28,.86); padding: 18px 20px; border-radius: 14px;
      display: none; pointer-events: auto; z-index: 8; color: #fff;
      border: 1px solid rgba(255,255,255,.18); box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    #settings-panel h3 {
      font-size: 16px; margin-bottom: 16px; text-align: center; letter-spacing: 3px; opacity: .95;
    }
    .setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; font-size: 13px; }
    .setting-row .s-name { display: flex; align-items: center; gap: 7px; width: 96px; flex: none; }
    .setting-row .s-name input { accent-color: #ffd34d; width: 15px; height: 15px; cursor: pointer; }
    .setting-row .s-vol { flex: 1; accent-color: #ffd34d; cursor: pointer; }
    .setting-row .s-val { width: 44px; text-align: right; opacity: .75; font-variant-numeric: tabular-nums; }
    .setting-row.off { opacity: .45; }
    #settings-panel button {
      width: 100%; margin-top: 10px; padding: 9px 0; cursor: pointer;
      background: rgba(255,211,77,.16); color: #fff; border: 1px solid rgba(255,211,77,.55);
      border-radius: 8px; font-size: 13px;
    }
    #settings-panel button:hover { background: rgba(255,211,77,.3); }
    #backpack h3 { font-size: 15px; margin-bottom: 10px; }
    #backpack-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .cell {
      aspect-ratio: 1; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.08);
      border-radius: 8px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; position: relative; font-size: 11px; color: #fff; cursor: pointer;
    }
    .cell.active, .cell:hover { border-color: rgba(255,211,77,.7); }
    /* 已选中等待交换的格子：高亮描边 */
    .cell.picked, .slot.picked {
      border-color: #ffd34d;
      box-shadow: 0 0 0 2px rgba(255,211,77,.5) inset, 0 0 12px rgba(255,211,77,.55);
    }
    .cell .ico { font-size: 24px; line-height: 1; }
    /* 图片图标：限制尺寸并居中，避免原始大图溢出格子 */
    .slot img.ico, .cell img.ico { width: 36px; height: 36px; object-fit: contain; }
    .cell .cnt { position: absolute; right: 4px; bottom: 2px; font-size: 12px; font-weight: 700; }
    .cell .nm  { opacity: .7; margin-top: 2px; font-size: 10px; }
    .empty-hint { opacity: .5; font-size: 12px; grid-column: 1 / -1; text-align: center; padding: 12px 0; }
    #overlay {
      position: fixed; inset: 0; background: rgba(5,10,25,.85); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      cursor: pointer; z-index: 10;
    }
    #overlay h1 { font-size: 40px; margin-bottom: 12px; }
    #overlay p { opacity: .8; font-size: 15px; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="charge"><i></i></div>
    <div id="equipped"></div>
    <div id="help">
      WASD 移动 · 鼠标 视角 · Shift 疾跑 · Space 跳跃<br/>
      右键 拾取/操作 · 左键 建造/放置/食用<br/>
      1-9 选择快捷栏 · C 合成菜单 · B 背包 · Esc 暂停/设置<br/>
      无帆/收帆：木筏随洋流漂移；扬帆：按船帆固定航向航行<br/>
      右键/E 瞄准船帆：开/收帆；调整航向时看向目标方向后左键确认<br/>
      右键/E 瞄准渔网：打开渔网储物面板，点击格子取出到背包
    </div>

    <div id="hotbar"></div>

    <div id="backpack">
      <h3>背包 <span style="opacity:.5;font-weight:400">（按 B 关闭 · 点击两格交换物品）</span></h3>
      <div id="backpack-grid"></div>
    </div>

    <div id="sail-panel">
      <h3>船帆</h3>
      <div class="state" id="sail-state"></div>
      <button id="sail-toggle">收起船帆</button>
      <button id="sail-set">调整航向（转动视角后确认）</button>
      <button id="sail-close">关闭（Esc）</button>
    </div>
    <div id="rescue-panel">
      <h3>远离木筏</h3>
      <div class="state" id="rescue-info"></div>
      <div class="row">
        <button id="rescue-confirm">传送回木筏</button>
        <button id="rescue-cancel">继续探索</button>
      </div>
    </div>
    <div id="net-panel">
      <h3>渔网</h3>
      <div class="state" id="net-info"></div>
      <div id="net-grid"></div>
      <div class="row">
        <button id="net-take-all">全部取出</button>
        <button id="net-close">关闭（Esc）</button>
      </div>
    </div>
    <div id="settings-panel">
      <h3>设置 · 已暂停</h3>
      <div class="setting-row" data-ch="bgm">
        <label class="s-name"><input type="checkbox" class="s-toggle"> 背景音乐</label>
        <input type="range" class="s-vol" min="0" max="100" step="1">
        <span class="s-val">50%</span>
      </div>
      <div class="setting-row" data-ch="ambient">
        <label class="s-name"><input type="checkbox" class="s-toggle"> 环境音</label>
        <input type="range" class="s-vol" min="0" max="100" step="1">
        <span class="s-val">30%</span>
      </div>
      <div class="setting-row" data-ch="sfx">
        <label class="s-name"><input type="checkbox" class="s-toggle"> 音效</label>
        <input type="range" class="s-vol" min="0" max="100" step="1">
        <span class="s-val">70%</span>
      </div>
      <div class="setting-row" data-ch="ui">
        <label class="s-name"><input type="checkbox" class="s-toggle"> 界面音</label>
        <input type="range" class="s-vol" min="0" max="100" step="1">
        <span class="s-val">50%</span>
      </div>
      <button id="settings-resume">返回游戏（Esc）</button>
    </div>
    <div id="prompt"></div>
    <div id="crafting">
      <h3>合成 (按 C 关闭)</h3>
      <div id="recipe-list"></div>
    </div>
  </div>

  <div id="overlay">
    <h1>木筏求生</h1>
    <p>点击屏幕开始 · 鼠标锁定控制权</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
